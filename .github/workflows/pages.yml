name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    # Playwright's own image already has Chromium and its system libraries, so the tests start in seconds
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.65.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build data
        run: python tools/build_data.py
      - name: Check site
        run: python tools/check_site.py
      - name: Browser smoke tests (STYLE.md 7)
        run: python -c "import playwright" 2>/dev/null || pip install -q --break-system-packages playwright==1.65.2; python tools/smoke_test.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build data
        run: python tools/build_data.py
      - name: Cache-bust asset links with the commit id
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" site/*.html site/app.js
      - name: Check site
        run: python tools/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub sometimes answers "No artifacts named github-pages" right after the upload; try once more (STYLE 7)
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
